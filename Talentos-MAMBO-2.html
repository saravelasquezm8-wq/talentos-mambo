<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talentos MAMBO</title>
<style>
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  :root{
    --bg:#0F0119;
    --bg-soft:#170228;
    --card:#1C0B32;
    --card-line:#3A2560;
    --ink:#F1E9FF;
    --muted:#B29FD1;
    --lav:#B18AF5;
    --lav-light:#E7D8FF;
    --lav-deep:#6B3FD6;
    --ok:#7FDCA8;
    --danger:#F08B7C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header{
    background:linear-gradient(180deg,#170228 0%, #0F0119 100%);
    padding:30px 24px 24px; text-align:center; border-bottom:1px solid var(--card-line);
  }
  header img{width:64px; height:64px; display:block; margin:0 auto 8px;}
  header h1{
    margin:0; font-size:30px; letter-spacing:1px; font-weight:900; color:var(--lav-light);
    text-transform:uppercase;
  }
  header p{margin:6px 0 0; color:var(--muted); font-size:14px;}
  nav{
    display:flex; gap:2px; background:var(--bg-soft); padding:0 16px; overflow-x:auto;
    border-bottom:1px solid var(--card-line);
  }
  nav button{
    background:none; border:none; color:var(--muted); padding:14px 16px; font-size:14px; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap; font-weight:700;
  }
  nav button.active{ color:var(--lav-light); border-bottom-color:var(--lav); }
  main{max-width:780px; margin:0 auto; padding:24px 20px 60px;}
  .card{
    background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:20px; margin-bottom:16px;
  }
  h2{font-size:17px; margin:0 0 14px; color:var(--lav-light); letter-spacing:0.3px;}
  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], select, input[type=password]{
    width:100%; padding:10px 12px; border:1px solid var(--card-line); border-radius:8px; font-size:15px;
    background:#0F0119; color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--lav); outline-offset:1px;}
  .points-badge{
    display:inline-block; background:linear-gradient(135deg,var(--lav),var(--lav-deep)); color:#fff; font-weight:800;
    padding:2px 10px; border-radius:20px; font-size:13px; margin-left:6px;
  }
  .checkline{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--card-line);
  }
  .checkline:last-child{border-bottom:none;}
  .checkline input{width:auto;}
  .checkline .lbl{flex:1; font-size:14px;}
  button.primary{
    background:linear-gradient(135deg,var(--lav),var(--lav-deep)); color:#fff; border:none; padding:12px 20px;
    border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:16px; width:100%;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.danger{
    background:none; border:1px solid var(--danger); color:var(--danger); padding:6px 12px;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:700;
  }
  button.approve{
    background:var(--ok); color:#0F0119; border:none; padding:6px 12px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:800;
  }
  .total-preview{
    margin-top:16px; padding:12px 14px; background:#170228; border:1px dashed var(--lav);
    border-radius:8px; font-size:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .total-preview strong{font-size:20px; color:var(--lav-light);}
  .item-row{
    border:1px solid var(--card-line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#170228;
  }
  .item-row .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .item-row .name{font-weight:700; font-size:15px; color:var(--ink);}
  .item-row .meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .status{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 8px; border-radius:20px;
  }
  .status.pending{background:#3A2560; color:var(--lav-light);}
  .status.approved{background:#1E3B2B; color:var(--ok);}
  .row-actions{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  .row-actions label{margin:0; font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; color:var(--muted);}
  .row-actions input{width:auto;}
  .empty{color:var(--muted); font-size:14px; padding:20px 0; text-align:center;}
  .period-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .period-toggle button{
    flex:1; background:#170228; border:1px solid var(--card-line); color:var(--muted); padding:10px;
    border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .period-toggle button.active{ background:linear-gradient(135deg,var(--lav),var(--lav-deep)); color:#fff; border-color:transparent;}
  .podium{display:flex; align-items:flex-end; gap:10px; justify-content:center; margin:10px 0 20px;}
  .podium .place{
    border-radius:12px 12px 0 0; text-align:center; padding:10px 8px 14px;
    flex:1; max-width:140px; color:#0F0119;
  }
  .podium .place.p1{background:var(--lav-light); height:150px; display:flex; flex-direction:column; justify-content:flex-end;}
  .podium .place.p2{background:var(--lav); color:#fff; height:120px; display:flex; flex-direction:column; justify-content:flex-end;}
  .podium .place.p3{background:var(--lav-deep); color:#fff; height:95px; display:flex; flex-direction:column; justify-content:flex-end;}
  .podium .medal{font-size:22px;}
  .podium .name{font-weight:800; font-size:13px; margin-top:4px;}
  .podium .pts{font-size:12px; opacity:0.9;}
  .leader-row{
    display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--card-line); font-size:14px;
  }
  .leader-row .n{font-weight:600; color:var(--ink);}
  .leader-row .p{font-weight:800; color:var(--lav-light);}
  .login-box{max-width:340px; margin:40px auto;}
  .login-box .card{text-align:left;}
  .error-msg{color:var(--danger); font-size:13px; margin-top:8px;}
  .hint{font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5;}
  .logout{float:right; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline;}
</style>
</head>

<script>
// ---------- Datos base ----------
const ITEMS = [
  {id:'dg-simple',  cat:'Diseño gráfico',            label:'Pieza simple — post, story, flyer de una sola pantalla, arte para una sola pieza de campaña', pts:10},
  {id:'dg-compleja',cat:'Diseño gráfico',            label:'Pieza compleja — carrusel, set multiformato, kit de piezas para una misma campaña', pts:20},
  {id:'ev-reel',    cat:'Edición de video',          label:'Reel / short — pieza de máximo 3 min', pts:20},
  {id:'ev-largo',   cat:'Edición de video',          label:'Video largo o campaña', pts:50},
  {id:'aa-media',   cat:'Asistencia en actividad',   label:'Media jornada — hasta 4 horas en set o en el evento', pts:30},
  {id:'aa-completa',cat:'Asistencia en actividad',   label:'Jornada completa — 5 horas o más', pts:60},
  {id:'ac-idea',    cat:'Aporte creativo',           label:'Idea sugerida — propuesta puntual compartida con el equipo', pts:15},
  {id:'ac-prop',    cat:'Aporte creativo',           label:'Propuesta desarrollada — idea documentada con justificación o mockup', pts:25},
  {id:'ac-sol',     cat:'Aporte creativo',           label:'Solución implementada — propuesta que el equipo adoptó y puso en práctica', pts:35},
];
const CATS = [...new Set(ITEMS.map(i=>i.cat))];

const ADMINS = {
  'FelipeGavilan':   {name:'Felipe', pass:'BOBOLAN'},
  'SebastianRosas':  {name:'Sebas',  pass:'STARBOY'},
  'SaraVelasquez':   {name:'Saris',  pass:'MAMBOQUEEN'},
};

// ---------- Conexión a la base compartida (Google Sheets vía Apps Script) ----------
// Pega aquí la URL que te da Google al desplegar el Apps Script como "Web app".
const API_URL = "https://script.google.com/macros/s/AKfycbwqmY--sFLyGYfozGSpmJ4JkfMpxxJuIWqyqSv9mjOwBAT9uVPOaWGsrzQ4hq-Q40ogXw/exec";

// ---------- Estado ----------
let data = {activities:[]};
let tab = 'enviar';
let adminUser = sessionStorage.getItem('mambo_admin') || null;
let period = 'semana'; // semana | mes | historico
let syncState = 'loading'; // loading | ok | error | unconfigured

async function fetchActivities(){
  if(API_URL.indexOf('PEGA_AQUI') === 0){
    syncState = 'unconfigured';
    renderAll();
    return;
  }

  try{
    const res = await fetch(API_URL);

    if(!res.ok){
      throw new Error('Error HTTP ' + res.status);
    }

    const list = await res.json();

    data.activities = list.map(a => ({
      ...a,
      basePts: Number(a.basePts),
      total: Number(a.total),
      ts: Number(a.ts),
      bonoResp: a.bonoResp === true || a.bonoResp === 'true',
      tiempo: a.tiempo === true || a.tiempo === 'true',
      impactoAlto: a.impactoAlto === true || a.impactoAlto === 'true',
    }));

    syncState = 'ok';

  }catch(e){
    console.warn('No se pudo actualizar la información:', e);

    // Si ya tenemos datos cargados, los conservamos
    // y NO reemplazamos la pantalla por el mensaje de error.
    if(data.activities.length === 0){
      syncState = 'error';
    }
  }

  renderAll();
}

// ---------- Navegación ----------
function renderNav(){
  const nav = document.getElementById('nav');
  const tabs = [
    ['enviar','Enviar actividad'],
    ['aprobaciones','Aprobaciones'],
    ['clasificacion','Clasificación'],
  ];
  nav.innerHTML = tabs.map(([id,label])=>
    `<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ tab = b.dataset.tab; renderAll(); };
  });
}

// ---------- Vista: Enviar actividad ----------
function viewEnviar(){
  const groups = CATS.map(cat=>{
    const opts = ITEMS.filter(i=>i.cat===cat)
      .map(i=>`<option value="${i.id}">${i.label} — ${i.pts} pts</option>`).join('');
    return `<optgroup label="${cat}">${opts}</optgroup>`;
  }).join('');

  return `
  <div class="card">
    <h2>Registrar una actividad</h2>
    <label>Nombre del voluntario</label>
    <input type="text" id="f-name" placeholder="Escribe tu nombre completo">

    <label>Tipo de actividad</label>
    <select id="f-item">
      <option value="">Selecciona una opción…</option>
      ${groups}
    </select>

    <div id="f-bonos" style="display:none; margin-top:10px;">
      <label style="margin-bottom:0;">Bono de asistencia (opcional)</label>
      <div class="checkline">
        <input type="checkbox" id="f-bono-resp">
        <span class="lbl">Responsable de actividad — a cargo de arte, sonido, luz, foto o cobertura en vivo</span>
        <span class="points-badge">+15</span>
      </div>
    </div>

    <label>Modificadores generales</label>
    <div class="checkline">
      <input type="checkbox" id="f-tiempo">
      <span class="lbl">Entrega antes del plazo</span>
      <span class="points-badge">+5</span>
    </div>
    <p class="hint">El factor de impacto (+10) es un criterio cualitativo que asigna un admin al momento de aprobar, no aquí.</p>

    <div class="total-preview">
      <span>Puntos estimados</span>
      <strong id="f-total">0</strong>
    </div>

    <button class="primary" onclick="submitActivity()">Enviar actividad</button>
  </div>`;
}

function wireEnviar(){
  const itemSel = document.getElementById('f-item');
  const bonosBox = document.getElementById('f-bonos');
  const respChk = document.getElementById('f-bono-resp');
  const tiempoChk = document.getElementById('f-tiempo');
  const totalEl = document.getElementById('f-total');

  function isAsistencia(){
    const it = ITEMS.find(i=>i.id===itemSel.value);
    return it && it.cat === 'Asistencia en actividad';
  }
  function recalc(){
    const it = ITEMS.find(i=>i.id===itemSel.value);
    const asistencia = isAsistencia();
    bonosBox.style.display = asistencia ? 'block' : 'none';
    if(!asistencia){ respChk.checked = false; }
    let total = it ? it.pts : 0;
    if(asistencia && respChk.checked) total += 15;
    if(tiempoChk.checked) total += 5;
    totalEl.textContent = total;
  }
  [itemSel, respChk, tiempoChk].forEach(el=> el.addEventListener('change', recalc));
  recalc();
}

async function submitActivity(){
  const name = document.getElementById('f-name').value.trim();
  const itemId = document.getElementById('f-item').value;
  const it = ITEMS.find(i=>i.id===itemId);
  if(!name){ alert('Escribe tu nombre.'); return; }
  if(!it){ alert('Selecciona un tipo de actividad.'); return; }
  const asistencia = it.cat === 'Asistencia en actividad';
  const bonoResp = asistencia && document.getElementById('f-bono-resp').checked;
  const tiempo = document.getElementById('f-tiempo').checked;
  let total = it.pts + (bonoResp?15:0) + (tiempo?5:0);

  const btn = document.querySelector('#main .primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  try{
    await sendAction({action:'create', data:{
      id: 'a'+Date.now()+Math.random().toString(16).slice(2),
      name, itemId, itemLabel: it.label, cat: it.cat, basePts: it.pts,
      bonoResp, tiempo, impactoAlto:false,
      total, status:'pending', ts: Date.now()
    }});
    alert('¡Actividad enviada! Un admin debe aprobarla para que sume en la clasificación.');
  }catch(e){
    alert('No se pudo enviar. Revisa tu conexión e intenta de nuevo.');
  }
  renderAll();
}

// ---------- Vista: Aprobaciones (admin) ----------
function viewAprobaciones(){
  if(!adminUser){
    return `
    <div class="login-box">
      <div class="card">
        <h2>Acceso de administrador</h2>
        <label>Usuario</label>
        <select id="lg-user">
          <option value="">Selecciona…</option>
          ${Object.keys(ADMINS).map(u=>`<option value="${u}">${ADMINS[u].name} (${u})</option>`).join('')}
        </select>
        <label>Contraseña</label>
        <input type="password" id="lg-pass">
        <button class="primary" onclick="doLogin()">Entrar</button>
        <div class="error-msg" id="lg-error"></div>
      </div>
    </div>`;
  }

  const pending = data.activities.filter(a=>a.status==='pending').sort((a,b)=>a.ts-b.ts);
  const approved = data.activities.filter(a=>a.status==='approved').sort((a,b)=>b.ts-a.ts);

  const row = (a, isPending) => `
    <div class="item-row">
      <div class="top">
        <div>
          <div class="name">${a.name} <span class="status ${a.status}">${a.status==='pending'?'pendiente':'aprobada'}</span></div>
          <div class="meta">${a.cat} · ${a.itemLabel}</div>
          <div class="meta">Base ${a.basePts} pts
            ${a.bonoResp?' · Responsable +15':''}${a.tiempo?' · A tiempo +5':''}${a.impactoAlto?' · Impacto alto +10':''}
          </div>
        </div>
        <div class="points-badge">${a.total} pts</div>
      </div>
      <div class="row-actions">
        ${isPending ? `
          <label><input type="checkbox" id="impacto-${a.id}"> Factor de impacto (+10)</label>
          <button class="approve" onclick="approveActivity('${a.id}')">Aprobar</button>
        ` : ``}
        <button class="danger" onclick="deleteActivity('${a.id}')">Eliminar</button>
      </div>
    </div>`;

  return `
  <div class="card">
    <button class="logout" onclick="doLogout()">Cerrar sesión (${ADMINS[adminUser].name})</button>
    <h2>Pendientes de aprobación</h2>
    ${pending.length ? pending.map(a=>row(a,true)).join('') : '<div class="empty">No hay actividades pendientes.</div>'}
  </div>
  <div class="card">
    <h2>Aprobadas</h2>
    <p class="hint" style="margin-top:0;">Como admin puedes eliminar cualquier actividad, aprobada o no, si hubo un error.</p>
    ${approved.length ? approved.map(a=>row(a,false)).join('') : '<div class="empty">Aún no hay actividades aprobadas.</div>'}
  </div>`;
}

function doLogin(){
  const user = document.getElementById('lg-user').value;
  const pass = document.getElementById('lg-pass').value;
  if(user && ADMINS[user] && ADMINS[user].pass === pass){
    adminUser = user;
    sessionStorage.setItem('mambo_admin', user);
    renderAll();
  }else{
    document.getElementById('lg-error').textContent = 'Usuario o contraseña incorrectos.';
  }
}
function doLogout(){
  adminUser = null;
  sessionStorage.removeItem('mambo_admin');
  renderAll();
}
async function approveActivity(id){
  const impacto = document.getElementById('impacto-'+id).checked;
  try{ await sendAction({action:'approve', id, impactoAlto: impacto}); }
  catch(e){ alert('No se pudo aprobar. Intenta de nuevo.'); }
  renderAll();
}
async function deleteActivity(id){
  if(!confirm('¿Eliminar esta actividad? Esta acción no se puede deshacer.')) return;
  try{ await sendAction({action:'delete', id}); }
  catch(e){ alert('No se pudo eliminar. Intenta de nuevo.'); }
  renderAll();
}

// ---------- Vista: Clasificación ----------
function startOfWeek(d){
  const day = (d.getDay()+6)%7; // lunes=0
  const r = new Date(d); r.setHours(0,0,0,0); r.setDate(d.getDate()-day);
  return r;
}
function startOfMonth(d){
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function filterByPeriod(activities){
  if(period === 'historico') return activities;
  const now = new Date();
  const start = period==='semana' ? startOfWeek(now) : startOfMonth(now);
  return activities.filter(a => a.ts >= start.getTime());
}

function viewClasificacion(){
  const approved = data.activities.filter(a=>a.status==='approved');
  const scoped = filterByPeriod(approved);
  const totals = {};
  scoped.forEach(a=>{ totals[a.name] = (totals[a.name]||0) + a.total; });
  const ranking = Object.entries(totals).sort((a,b)=>b[1]-a[1]);

  const toggle = `
    <div class="period-toggle">
      <button class="${period==='semana'?'active':''}" onclick="setPeriod('semana')">Cierre semanal</button>
      <button class="${period==='mes'?'active':''}" onclick="setPeriod('mes')">Talentos del mes</button>
      <button class="${period==='historico'?'active':''}" onclick="setPeriod('historico')">Histórico</button>
    </div>`;

  if(!ranking.length){
    return `<div class="card"><h2>Clasificación</h2>${toggle}<div class="empty">Todavía no hay actividades aprobadas en este periodo.</div></div>`;
  }

  const top3 = ranking.slice(0,3);
  const order = [1,0,2].filter(i=>top3[i]); // 2do, 1ro, 3ro visualmente
  const medals = {0:'🥇',1:'🥈',2:'🥉'};
  const podiumHtml = order.map(i=>{
    const [name, pts] = top3[i];
    const cls = i===0?'p1':i===1?'p2':'p3';
    return `<div class="place ${cls}"><div class="medal">${medals[i]}</div><div class="name">${name}</div><div class="pts">${pts} pts</div></div>`;
  }).join('');

  const restHtml = ranking.slice(3).map(([name,pts],idx)=>
    `<div class="leader-row"><span class="n">${idx+4}. ${name}</span><span class="p">${pts} pts</span></div>`
  ).join('');

  return `
  <div class="card">
    <h2>${period==='mes' ? 'Talentos del mes' : period==='semana' ? 'Podio de la semana' : 'Podio histórico'}</h2>
    ${toggle}
    <div class="podium">${podiumHtml}</div>
    ${restHtml ? `<h2>Resto de la clasificación</h2>${restHtml}` : ''}
  </div>`;
}
function setPeriod(p){ period = p; renderAll(); }

// ---------- Render principal ----------
function renderAll(){
  renderNav();
  const main = document.getElementById('main');
  if(syncState === 'unconfigured'){
    main.innerHTML = `<div class="card"><h2>Falta un paso</h2><p class="hint" style="margin-top:0; font-size:14px;">
      Este archivo todavía no está conectado a la hoja de cálculo compartida. Abre el archivo con un editor de texto,
      busca <code>PEGA_AQUI_TU_URL_DE_APPS_SCRIPT</code> cerca del inicio del <code>&lt;script&gt;</code> y reemplázalo
      por la URL de tu Web App de Google Apps Script.</p></div>`;
    return;
  }
  if(syncState === 'loading'){
    main.innerHTML = `<div class="card"><div class="empty">Cargando datos compartidos…</div></div>`;
    return;
  }
  if(syncState === 'error'){
    main.innerHTML = `<div class="card"><div class="empty">No se pudo conectar con la hoja compartida. Revisa tu conexión a internet.</div></div>
      <div class="card"><button class="primary" onclick="fetchActivities()">Reintentar</button></div>`;
    return;
  }
  if(tab==='enviar'){ main.innerHTML = viewEnviar(); wireEnviar(); }
  else if(tab==='aprobaciones'){ main.innerHTML = viewAprobaciones(); }
  else if(tab==='clasificacion'){ main.innerHTML = viewClasificacion(); }
}

fetchActivities();
setInterval(()=>{
  // Refresco silencioso: si estás llenando el formulario de "Enviar actividad",
  // no lo volvemos a dibujar para no borrar lo que ya escribiste.
  if(tab === 'enviar' && syncState === 'ok'){
    fetchActivitiesQuiet();
  } else {
    fetchActivities();
  }
}, 6000);

async function fetchActivitiesQuiet(){
  if(API_URL.indexOf('PEGA_AQUI') === 0) return;
  try{
    const res = await fetch(API_URL);
    const list = await res.json();
    data.activities = list.map(a => ({
      ...a,
      basePts: Number(a.basePts), total: Number(a.total), ts: Number(a.ts),
      bonoResp: a.bonoResp === true || a.bonoResp === 'true',
      tiempo: a.tiempo === true || a.tiempo === 'true',
      impactoAlto: a.impactoAlto === true || a.impactoAlto === 'true',
    }));
    syncState = 'ok';
  }catch(e){ /* si falla en silencio, se reintenta en el próximo ciclo */ }
  // No llamamos renderAll() aquí a propósito: los datos quedan listos
  // y se ven en cuanto cambies de pestaña, sin interrumpir lo que escribes.
}
</script>
